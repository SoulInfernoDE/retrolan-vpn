# =====================================================================
# RetroLAN Community Game Database (games.toml)
# Optimized for AVX (x86-64-v3) & Kernel NTSYNC Support
# =====================================================================

[[games]]
name = "FlatOut 2"
steam_appid = 2990
process_names = ["FlatOut2.exe"]
protocol = "udp_broadcast"
broadcast_port = 23756
require_wsock32_hook = false
force_bind_ip = true
recommended_proton = "proton-cachyos-v3"
notes = "Classic crash racing LAN favorite. Runs best on Proton-CachyOS v3 (AVX2/NTSYNC) or GE-Proton for ultra-low latency physics."

[[games]]
